name: Subscriptions Daily

# Job quotidien du cycle de vie des abonnements ANIF Seller :
#   1. remind_expiring_subscriptions : rappel email aux vendeurs dont
#      l'abonnement expire dans la semaine (1 rappel tous les 2 jours).
#   2. expire_subscriptions : rétrograde au plan FREE les vendeurs dont
#      l'abonnement payant est expiré.
# Exécuté dans cet ordre pour que le rappel parte avant toute rétrogradation
# du jour. Contre la base de production Render, avec les vraies clés Resend
# pour l'envoi d'email.
# Secrets requis (repo → Settings → Secrets → Actions) :
#   - RENDER_DATABASE_URL      : "External Database URL" du dashboard Render
#   - SECRET_KEY               : SECRET_KEY Django de production (Render → Environment)
#   - RESEND_API_KEY           : clé API Resend de production
#   - RESEND_FROM_EMAIL        : adresse d'envoi Resend de production
#   - SELLER_FRONTEND_BASE_URL : URL du dashboard vendeur (lien "Renouveler")
# Sans RENDER_DATABASE_URL, le workflow se termine sans erreur (simple notice)
# pour ne pas générer un échec quotidien tant que la prod n'est pas branchée.

on:
  schedule:
    - cron: "0 8 * * *" # tous les jours à 08:00 UTC
  workflow_dispatch:

jobs:
  subscriptions:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      SELLER_FRONTEND_BASE_URL: ${{ secrets.SELLER_FRONTEND_BASE_URL }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::RENDER_DATABASE_URL absent — job ignoré."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.check.outputs.configured == 'true'

      - name: Setup Python
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: code/backend/requirements.txt

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        working-directory: code/backend
        run: pip install -r requirements.txt

      - name: Send expiry reminders
        if: steps.check.outputs.configured == 'true'
        working-directory: code/backend
        run: python manage.py remind_expiring_subscriptions

      - name: Expire overdue subscriptions
        if: steps.check.outputs.configured == 'true'
        working-directory: code/backend
        run: python manage.py expire_subscriptions

      - name: Notify on failure
        if: failure() && steps.check.outputs.configured == 'true'
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.NOTIFY_EMAIL_USER }}
          password: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
          subject: "❌ Échec job abonnements - ANIFOWOCHE E-commerce"
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: ANIFOWOCHE Backup Bot
          body: "Le workflow Subscriptions Daily a échoué (rappel ou expiration). Voir les logs GitHub Actions."